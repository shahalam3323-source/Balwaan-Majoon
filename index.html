    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-green: #0f3d2e;
            --accent-gold: #c9a24d;
            --light-gold: #f5e6b8;
            --dark-bg: #102721;
            --white: #ffffff;
            --light-bg: #f8f5f0;
            --text-dark: #333333;
            --text-light: #666666;
            --shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        h1, h2, h3, h4 {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: var(--primary-green);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .section {
            padding: 80px 0;
        }
        
        .section-title {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 50px;
            position: relative;
        }
        
        .section-title:after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: var(--accent-gold);
        }
        
        .btn {
            display: inline-block;
            background: var(--accent-gold);
            color: var(--primary-green);
            padding: 15px 35px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            text-align: center;
        }
        
        .btn:hover {
            background: var(--light-gold);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(201, 162, 77, 0.2);
        }
        
        .btn-large {
            padding: 18px 45px;
            font-size: 1.2rem;
        }
        
        /* HEADER */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--primary-green);
            padding: 15px 0;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
        }
        
        .header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-family: 'Poppins', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-gold);
        }
        
        .logo span {
            color: var(--white);
        }
        
        .nav-cta {
            background: var(--accent-gold);
            color: var(--primary-green);
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }
        
        .nav-cta:hover {
            background: var(--light-gold);
        }
        
        /* HERO SECTION */
        .hero {
            background: linear-gradient(135deg, var(--primary-green) 0%, #1a4d3c 100%);
            color: var(--white);
            padding: 150px 0 80px;
            position: relative;
            overflow: hidden;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(201, 162, 77, 0.1) 0%, transparent 70%);
        }
        
        .hero-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }
        
        .hero-text {
            flex: 1;
            max-width: 600px;
        }
        
        .hero-image {
            flex: 1;
            text-align: center;
        }
        
        .hero-image img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        
        .hero-badge {
            display: inline-block;
            background: var(--accent-gold);
            color: var(--primary-green);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        .hero-title {
            font-size: 3.2rem;
            color: var(--light-gold);
            margin-bottom: 20px;
            line-height: 1.2;
        }
        
        .hero-description {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .hero-benefits {
            margin: 25px 0;
        }
        
        .benefit-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .benefit-item i {
            color: var(--accent-gold);
            margin-right: 10px;
            font-size: 1.2rem;
        }
        
        /* PROBLEM & SOLUTION SECTION */
        .problem-solution {
            background: var(--light-bg);
        }
        
        .problem-solution .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }
        
        .problem-box, .solution-box {
            background: var(--white);
            padding: 40px;
            border-radius: 15px;
            box-shadow: var(--shadow);
        }
        
        .problem-title, .solution-title {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: var(--primary-green);
        }
        
        .problem-list, .solution-list {
            list-style: none;
        }
        
        .problem-list li, .solution-list li {
            margin-bottom: 15px;
            padding-left: 25px;
            position: relative;
        }
        
        .problem-list li:before {
            content: '❌';
            position: absolute;
            left: 0;
            color: #e63946;
        }
        
        .solution-list li:before {
            content: '✅';
            position: absolute;
            left: 0;
            color: #2a9d8f;
        }
        
        /* BENEFITS SECTION */
        .benefits-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }
        
        .benefit-card {
            background: var(--white);
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            text-align: center;
        }
        
        .benefit-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }
        
        .benefit-icon {
            font-size: 3rem;
            color: var(--accent-gold);
            margin-bottom: 20px;
        }
        
        .benefit-card h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        
        /* STATS SECTION */
        .stats {
            background: linear-gradient(135deg, var(--primary-green) 0%, #1a4d3c 100%);
            color: var(--white);
        }
        
        .stats-title {
            color: var(--light-gold);
            text-align: center;
            margin-bottom: 50px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            text-align: center;
        }
        
        .stat-item h3 {
            font-size: 2.8rem;
            color: var(--accent-gold);
            margin-bottom: 10px;
        }
        
        .stat-item p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        /* INGREDIENTS SECTION */
        .ingredients {
            background: var(--light-bg);
        }
        
        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
        }
        
        .ingredient-card {
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        
        .ingredient-card:hover {
            transform: translateY(-5px);
        }
        
        .ingredient-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 20px;
            border: 3px solid var(--light-gold);
        }
        
        .ingredient-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .ingredient-card h4 {
            margin-bottom: 10px;
            font-size: 1.4rem;
        }
        
        /* DOSAGE SECTION */
        .dosage {
            text-align: center;
        }
        
        .dosage-box {
            background: var(--white);
            padding: 50px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            max-width: 600px;
            margin: 0 auto;
        }
        
        .dosage-icon {
            font-size: 4rem;
            color: var(--accent-gold);
            margin-bottom: 20px;
        }
        
        .dosage-box h3 {
            font-size: 2rem;
            margin-bottom: 15px;
        }
        
        /* REVIEWS SECTION */
        .reviews {
            background: var(--light-bg);
        }
        
        .reviews-slider {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }
        
        .review-card {
            background: var(--white);
            padding: 35px 30px;
            border-radius: 15px;
            box-shadow: var(--shadow);
        }
        
        .review-stars {
            color: var(--accent-gold);
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        
        .review-text {
            font-style: italic;
            margin-bottom: 20px;
        }
        
        .review-author {
            font-weight: 600;
            color: var(--primary-green);
        }
        
        /* FAQ SECTION */
        .faq-item {
            background: var(--white);
            margin-bottom: 15px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        
        .faq-question {
            padding: 20px 25px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .faq-answer {
            padding: 0 25px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .faq-item.active .faq-answer {
            padding: 0 25px 25px;
            max-height: 500px;
        }
        
        /* CTA SECTION */
        .cta-section {
            background: linear-gradient(135deg, var(--primary-green) 0%, #1a4d3c 100%);
            color: var(--white);
            text-align: center;
        }
        
        .cta-title {
            color: var(--light-gold);
            margin-bottom: 20px;
        }
        
        .cta-description {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.9;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* COUNSELING SECTION */
        .counseling {
            background: var(--light-bg);
            text-align: center;
        }
        
        .counseling-box {
            background: var(--white);
            padding: 50px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            max-width: 700px;
            margin: 0 auto;
        }
        
        .counseling-icon {
            font-size: 4rem;
            color: #25D366;
            margin-bottom: 20px;
        }
        
        .whatsapp-btn {
            background: #25D366;
            color: white;
            margin-top: 20px;
        }
        
        .whatsapp-btn:hover {
            background: #128C7E;
        }
        
        /* FOOTER */
        .footer {
            background: var(--dark-bg);
            color: var(--white);
            padding: 60px 0 30px;
        }
        
        .footer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 40px;
            margin-bottom: 40px;
        }
        
        .footer-column h4 {
            color: var(--accent-gold);
            margin-bottom: 20px;
            font-size: 1.2rem;
        }
        
        .footer-links {
            list-style: none;
        }
        
        .footer-links li {
            margin-bottom: 10px;
        }
        
        .footer-links a {
            color: #cccccc;
            text-decoration: none;
            transition: var(--transition);
        }
        
        .footer-links a:hover {
            color: var(--accent-gold);
        }
        
        .disclaimer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 30px;
            text-align: center;
            font-size: 14px;
            color: #aaaaaa;
            line-height: 1.7;
        }
        
        .copyright {
            text-align: center;
            margin-top: 20px;
            color: #888888;
            font-size: 14px;
        }
        
        /* FLOATING ELEMENTS */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #25D366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
            z-index: 1000;
            text-decoration: none;
            transition: var(--transition);
        }
        
        .whatsapp-float:hover {
            background: #128C7E;
            transform: scale(1.1);
        }
        
        .guarantee-badge {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: var(--accent-gold);
            color: var(--primary-green);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: var(--shadow);
            z-index: 1000;
            max-width: 180px;
            font-weight: 600;
        }
        
        .guarantee-badge i {
            font-size: 2rem;
            display: block;
            margin-bottom: 8px;
        }
        
        /* RESPONSIVENESS */
        @media (max-width: 1024px) {
            .hero-content, .problem-solution .container {
                flex-direction: column;
                grid-template-columns: 1fr;
            }
            
            .hero-text, .hero-image {
                max-width: 100%;
                text-align: center;
            }
            
            .hero-title {
                font-size: 2.5rem;
            }
            
            .benefits-grid, .stats-grid, .ingredients-grid, .reviews-slider, .footer-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .section {
                padding: 60px 0;
            }
            
            .section-title {
                font-size: 2rem;
            }
            
            .hero {
                padding: 130px 0 60px;
            }
            
            .benefits-grid, .stats-grid, .ingredients-grid, .reviews-slider, .footer-grid {
                grid-template-columns: 1fr;
            }
            
            .whatsapp-float, .guarantee-badge {
                bottom: 20px;
            }
            
            .whatsapp-float {
                right: 20px;
            }
            
            .guarantee-badge {
                left: 20px;
                max-width: 150px;
                font-size: 14px;
            }
        }
        
        @media (max-width: 480px) {
            .section-title {
                font-size: 1.8rem;
            }
            
            .hero-title {
                font-size: 2rem;
            }
            
            .problem-box, .solution-box, .benefit-card, .dosage-box, .review-card, .counseling-box {
                padding: 25px 20px;
            }
            
            .btn {
                padding: 12px 25px;
            }
        }
    </style>
</head>
